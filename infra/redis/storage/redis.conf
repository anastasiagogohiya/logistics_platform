# Порт (будет отличаться)
port 6380

# Максимум памяти — 1 ГБ
maxmemory 1gb

# Политика вытеснения: не вытеснять (или allkeys-lru если нужно)
maxmemory-policy noeviction

# Включаем сохранение на диск (AOF)
appendonly yes
appendfsync everysec

# RDB снапшоты (на всякий случай)
save 900 1
save 300 10
save 60 10000

# Включаем уведомления
notify-keyspace-events Ex

# Защита от потери данных
stop-writes-on-bgsave-error yes