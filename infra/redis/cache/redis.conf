# Порт
port 6379

# Максимум памяти — 256 МБ
maxmemory 256mb

# Политика вытеснения: удаляем старые (LRU)
maxmemory-policy allkeys-lru

# Отключаем сохранение на диск (чистый кэш)
save ""

# Включаем уведомления о событиях (для кэша)
notify-keyspace-events Ex

# Выключаем AOF (не нужно сохранять кэш)
appendonly no

# Срок жизни ключей — 1 час (можно менять в коде)
# TTL задается через EXPIRE в коде