[tool.poetry]
name = "infra-logging"
version = "0.1.0"
description = "Общая библиотека логирования для логистической платформы"
authors = ["Anastasiya Gogokhiya <gogiau@bk.ru>"]
packages = [
    { include = "infra_logging", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
python-json-logger = ">=2.0.0"
django = ">=4.2.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
