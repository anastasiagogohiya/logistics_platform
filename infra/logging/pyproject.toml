[project]
name = "infra-logging"
version = "0.1.0"
description = "Общая библиотека логирования"
authors = [
    {name = "Anastasiya Gogokhiya", email = "gogiau@bk.ru"}
]
requires-python = ">=3.10"
dependencies = [
    "python-json-logger>=2.0.0",
    "django>=4.0,<7.0",  # ← Изменено: теперь поддерживает до 7.0
]

[tool.poetry]
packages = [{include = "infra_logging", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"