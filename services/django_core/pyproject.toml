[project]
name = "django-core"
version = "0.1.0"
description = ""
authors = [
    {name = "Anastasiya Gogokhiya",email = "gogiau@bk.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django (>=6.0.6,<7.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "redis (>=8.0.0,<9.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "django-jazzmin (>=3.0.4,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "elasticsearch-dsl (>=8.18.0,<9.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)"
]

[tool.poetry]
packages = [{include = "django_core", from = "src"}]

[tool.poetry.dependencies]
infra-logging = {path = "infra/logging", develop = true}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"



[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.*"]
disallow_untyped_defs = false