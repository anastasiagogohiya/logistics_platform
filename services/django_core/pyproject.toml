[tool.poetry]
name = "django-core"
version = "0.1.0"
description = "Django core service for logistics platform"
authors = ["Anastasiya Gogokhiya <gogiau@bk.ru>"]
packages = [{include = "django_core", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
django = ">=6.0.6,<7.0.0"
djangorestframework = ">=3.17.1,<4.0.0"
django-cors-headers = ">=4.9.0,<5.0.0"
psycopg2-binary = ">=2.9.12,<3.0.0"
redis = ">=8.0.0,<9.0.0"
celery = ">=5.6.3,<6.0.0"
pillow = ">=12.2.0,<13.0.0"
django-jazzmin = ">=3.0.4,<4.0.0"
python-dotenv = ">=1.2.2,<2.0.0"
elasticsearch-dsl = ">=8.18.0,<9.0.0"
djangorestframework-simplejwt = ">=5.5.1,<6.0.0"
cryptography = ">=42.0.0,<43.0.0"

# Относительный путь
infra-logging = {path = "infra/logging", develop = true}

[tool.poetry.group.dev.dependencies]
ruff = "^0.4.5"
mypy = "^1.10.0"
pytest = ">=8.2,<9"
pytest-django = "^4.8.0"
pytest-cov = ">=5.0,<6.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
ignore_errors = true # пока отключено

[[tool.mypy.overrides]]
module = ["src.*"]
disallow_untyped_defs = false
