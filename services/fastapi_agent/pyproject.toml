[tool.poetry]
name = "fastapi-agent"
version = "0.1.0"
description = "FastAPI agent service for logistics platform"
authors = ["Anastasiya Gogokhiya <gogiau@bk.ru>"]
readme = "README.md"
packages = [{include = "fastapi_agent", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
setuptools = "^69.0.0"
fastapi = "^0.138.0"
httpx = "^0.28.1"
pydantic = "^2.13.4"
json-logify = "^0.2.3"
email-validator = "^2.3.0"
natasha = "^1.6.0"
dateparser = "^1.4.1"
pymystem3 = "^0.2.0"
redis = "^7.2"
langgraph = "^1.2.9"
langchain = "^1.3.12"
langchain-openai = "^1.3.4"
langgraph-checkpoint-redis = "^0.5.0"
uvicorn = {version = "^0.49.0", extras = ["standard"]}

# Относительный путь (будет работать внутри контейнера)
infra-logging = {path = "infra/logging", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "8.3.5"
pytest-asyncio = "0.24.0"
pytest-cov = "^5.0.0"
ruff = "^0.4.5"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pipeline-wheels"
url = "https://storage.yandexcloud.net/deeppavlov-wheels/"
default = false
secondary = true
# -------------------------


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "C", "B", "UP",
]
ignore = [
    "E501",
    "B008",
    "C901",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
ignore_missing_imports = true
ignore_errors = true # пока отключено

[[tool.mypy.overrides]]
module = ["src.*"]
disallow_untyped_defs = false
