[project]
name = "fastapi-agent"
version = "0.1.0"
description = ""
authors = [
    {name = "Anastasiya Gogokhiya", email = "gogiau@bk.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"

[tool.poetry]
packages = [{include = "fastapi_agent", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
uvicorn = {version = ">=0.49.0,<0.50.0", extras = ["standard"]}
pytest = "8.3.5"               # фиксированная версия
pytest-asyncio = "0.24.0"      # фиксированная версия
pytest-cov = "^5.0.0"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
fastapi = "^0.138.0"
httpx = "^0.28.1"
pydantic = "^2.13.4"
json-logify = "^0.2.3"
email-validator = "^2.3.0"
natasha = "^1.6.0"
dateparser = "^1.4.1"
redis = "^7.2"
langgraph = "^1.2.9"
langchain = "^1.3.12"
langchain-openai = "^1.3.4"
langgraph-checkpoint-redis = "^0.5.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]


[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.*"]
disallow_untyped_defs = false