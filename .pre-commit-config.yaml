# .pre-commit-config.yaml
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.5
    hooks:
      - id: ruff
        name: Ruff (FastAPI)
        files: ^services/fastapi_agent/src/
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff
        name: Ruff (Django)
        files: ^services/django_core/src/
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: Ruff Format (FastAPI)
        files: ^services/fastapi_agent/src/
      - id: ruff-format
        name: Ruff Format (Django)
        files: ^services/django_core/src/

